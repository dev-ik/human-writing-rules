name: Validate
on: [push, pull_request]
jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci
      - run: npm run verify
